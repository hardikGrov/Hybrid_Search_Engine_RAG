[project]
name = "hybrid-search-engine-rag"
version = "0.1.0"
description = "Scaffold for a hybrid search system with FastAPI and Streamlit."
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0.0",
    "faiss-cpu>=1.8.0",
    "fastapi>=0.115.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "sentence-transformers>=3.0.0",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.36.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "hybrid_search*"]
exclude = ["frontend*"]
